name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0
  NODE_VERSION: "24"

jobs:
  build:
    name: Build & unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Wails v3.0 builds against GTK4 + WebKitGTK 6.0 by default; the
          # GTK3 + WebKit2GTK 4.1 stack is needed for `-tags gtk3` builds.
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests (Vitest, coverage thresholds 80%)
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Build frontend (embedded by main.go)
        working-directory: frontend
        run: npm run build

      - name: go vet
        run: go vet ./...

      - name: Go unit tests (-short, no Docker)
        run: go test -short ./...

      - name: Build-tool tests (tools/ module)
        working-directory: tools
        run: go test -cover ./...

      - name: wails3 build (version-stamped)
        run: |
          wails3 task version
          wails3 build

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lontar-${{ runner.os }}
          path: bin/
          if-no-files-found: error

  integration:
    name: Go integration tests + coverage gate (Docker, Linux)
    # Hosted macOS/Windows runners cannot run Linux containers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go tests incl. testcontainers (PostgreSQL 16, MySQL 8, MariaDB 11)
        run: go test ./... -coverprofile=coverage.out

      - name: Coverage gate (>= 80%)
        run: wails3 task cover

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
